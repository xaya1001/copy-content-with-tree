name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PKG_VERSION"

      - name: Full gate without Extension Host (package path)
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run audit
          npm run package
          node scripts/check-vsix.mjs

      - name: Extension Host smoke (xvfb)
        env:
          VSCODE_TEST_VERSION: stable
        run: xvfb-run -a npm run test:electron

      - name: Checksum VSIX
        run: |
          set -euo pipefail
          VSIX="copy-content-with-tree-$(node -p 'require("./package.json").version').vsix"
          sha256sum "$VSIX" | tee "${VSIX}.sha256"

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: 'copy-content-with-tree-*.vsix'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: |
            copy-content-with-tree-*.vsix
            copy-content-with-tree-*.vsix.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            copy-content-with-tree-*.vsix
            copy-content-with-tree-*.vsix.sha256
