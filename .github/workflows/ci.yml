name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, typecheck
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: npm audit
        run: npm run audit

  package-and-electron:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise engines.vscode minimum and current stable.
        vscode: ['1.80.0', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package and verify VSIX
        if: matrix.vscode == 'stable'
        run: |
          npm run package
          node scripts/check-vsix.mjs

      - name: Extension Host smoke (xvfb)
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:electron
